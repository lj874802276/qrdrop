<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QRDrop · 收件箱</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <h1 class="app-title">QRDrop<span class="app-sub" data-i18n="brandSub">扫码传文件</span></h1>
  <div class="topbar-actions">
    <button id="historyBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="history">历史记录</button>
    <button id="settingsBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="settings">设置</button>
    <button id="themeToggle" class="btn btn-ghost btn-sm" type="button">深色</button>
    <button id="langToggle" class="btn btn-ghost btn-sm" type="button">中 | En</button>
  </div>
</header>

<main class="page">
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="newInbox" class="btn btn-primary" type="button" data-i18n="newInbox">新建收件箱</button>
      <span id="statusChip" class="chip chip-idle">
        <i class="chip-dot" aria-hidden="true"></i>
        <span id="statusText">未开启</span>
      </span>
    </div>
    <button id="closeInbox" class="btn btn-danger btn-sm" type="button" hidden data-i18n="closeInbox">关闭收件箱</button>
  </div>

  <div class="grid">
    <section class="card qr-panel">
      <h3 id="qrTitle" class="qr-title" data-i18n="qrTitle" hidden>扫码上传文件</h3>
      <div class="qr-frame">
        <img id="qrImage" class="qr-image" width="240" height="240" alt="QR code" hidden>
        <p id="qrPlaceholder" class="qr-placeholder" data-i18n="qrHint">点击「新建收件箱」生成二维码</p>
      </div>
      <p id="netHint" class="net-hint" hidden>
        <svg class="net-hint-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12.5a10 10 0 0 1 14 0M8 15.5a6 6 0 0 1 8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="18.5" r="1.2" fill="currentColor"/>
        </svg>
        <span data-i18n="netHint">手机需连同一 WiFi，不能只用流量</span>
      </p>
      <div id="qrMeta" class="qr-meta" hidden>
        <span class="meta-ttl">
          <span data-i18n="sessionTTL">会话有效期</span>
          <span id="countdown" class="mono">--:--</span>
        </span>
        <span class="meta-actions">
          <button id="copyLink" class="btn btn-link" type="button" data-i18n="copyLink">复制链接</button>
          <span class="meta-dot" aria-hidden="true">·</span>
          <button id="troubleToggle" class="trouble-toggle" type="button" hidden data-i18n="troubleTitle">手机扫不开？</button>
        </span>
      </div>
      <ul id="troublePanel" class="trouble-panel" hidden>
        <li data-i18n="troubleStep1">确认手机连的是与电脑相同的 WiFi，不要用移动流量</li>
        <li data-i18n="troubleStep2">关闭手机上的 VPN / 代理软件</li>
        <li data-i18n="troubleStep3">企业 / 公共 WiFi 常隔离设备，可让手机开热点、电脑连热点后再扫</li>
        <li data-i18n="troubleStep4">换用系统相机或微信「扫一扫」（浏览器内置扫码有时不跳转）</li>
      </ul>
    </section>

    <section class="card files-panel">
      <h2 class="card-title">
        <span data-i18n="receivedFiles">已接收文件</span>
        <span id="fileCount" class="count-badge">0</span>
      </h2>
      <ul id="fileList" class="file-list"></ul>
      <p id="fileEmpty" class="file-empty">
        <svg class="empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="waitingFiles">等待对方上传…</span>
      </p>
      <div class="save-hint">
        <span class="save-hint-label">
          <span class="save-label" data-i18n="saveTo">自动保存到</span>
          <span id="saveDir" class="mono save-dir">—</span>
        </span>
        <button id="openSaveDir" class="btn btn-ghost btn-sm icon-btn" type="button" data-i18n-title="openSaveDir" title="打开保存位置" hidden>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M1.5 4.5a1 1 0 0 1 1-1h3L6.7 4.9h5.8a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H2.5a1 1 0 0 1-1-1V4.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>
  </div>
</main>

<div id="settingsOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-head">
      <h2 class="overlay-title" data-i18n="settingsTitle">保存位置</h2>
      <button id="settingsClose" class="btn btn-ghost btn-sm icon-btn" type="button" aria-label="close">×</button>
    </div>
    <fieldset class="pref-group">
      <label class="radio"><input type="radio" name="savePref" value="desktop"><span data-i18n="saveDesktop">桌面</span></label>
      <label class="radio"><input type="radio" name="savePref" value="default"><span data-i18n="saveDefault">默认目录</span></label>
      <label class="radio"><input type="radio" name="savePref" value="custom"><span data-i18n="saveCustom">自定义</span></label>
    </fieldset>
    <input id="customPath" class="text-input" type="text" data-i18n-placeholder="saveCustomPlaceholder" placeholder="输入保存文件夹的完整路径" hidden>
    <p class="resolved-line">
      <span data-i18n="resolvedDir">实际保存位置</span>：<span id="resolvedDir" class="mono">—</span>
    </p>
    <p id="pathStatus" class="path-status" hidden></p>
    <div class="overlay-foot">
      <button id="saveSettingsBtn" class="btn btn-primary btn-sm" type="button" data-i18n="saveBtn">保存</button>
    </div>
  </div>
</div>

<div id="historyOverlay" class="overlay" hidden>
  <div class="overlay-card overlay-wide">
    <div class="overlay-head">
      <h2 class="overlay-title" data-i18n="history">历史记录</h2>
      <button id="historyClose" class="btn btn-ghost btn-sm icon-btn" type="button" aria-label="close">×</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
    <p id="historyEmpty" class="file-empty" data-i18n="historyEmpty">暂无历史记录</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
