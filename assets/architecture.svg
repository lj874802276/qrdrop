<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff4ff"/><stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fb"/><stop offset="1" stop-color="#e4ebf5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">QRDrop 系统架构 · Architecture</text>
  <text x="20" y="50" font-size="12" fill="#64748b">同一局域网内点对点传输，无需公网、无需账号</text>

  <!-- Phone -->
  <rect x="24" y="92" width="158" height="150" rx="16" fill="url(#phone)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="103" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">手机 · Phone</text>
  <g stroke="#2563eb" stroke-width="1.6" fill="none" stroke-linecap="round">
    <rect x="56" y="134" width="94" height="60" rx="8" fill="#fff"/>
    <path d="M70 180 h66 M70 192 h44"/>
    <circle cx="103" cy="150" r="9"/><path d="M97 164 h12"/>
  </g>
  <text x="103" y="214" text-anchor="middle" font-size="11" fill="#334155">扫码打开上传页</text>
  <text x="103" y="230" text-anchor="middle" font-size="11" fill="#334155">选文件 → 上传</text>

  <!-- LAN -->
  <g transform="translate(300,118)">
    <path d="M30 60 a40 40 0 0 1 80 0" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M45 60 a26 26 0 0 1 50 0" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M60 60 a12 12 0 0 1 24 0" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="72" cy="60" r="3.4" fill="#2563eb"/>
    <text x="72" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">局域网 WiFi</text>
    <text x="72" y="108" text-anchor="middle" font-size="10" fill="#64748b">同一网段</text>
  </g>

  <!-- PC stack -->
  <rect x="556" y="86" width="190" height="160" rx="16" fill="url(#pc)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="651" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">电脑 · PC</text>

  <rect x="576" y="124" width="150" height="34" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="651" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">QRDrop 服务 (Go)</text>

  <rect x="576" y="166" width="150" height="30" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="651" y="186" text-anchor="middle" font-size="11.5" fill="#334155">SQLite 元信息</text>

  <rect x="576" y="204" width="150" height="30" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="651" y="224" text-anchor="middle" font-size="11.5" fill="#334155">落盘目录 (保存文件)</text>

  <!-- arrows -->
  <path d="M184 167 C240 167 250 158 296 158" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M384 158 C450 158 470 167 556 167" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="240" y="156" text-anchor="middle" font-size="10" fill="#64748b">上传 HTTPS</text>
  <text x="470" y="156" text-anchor="middle" font-size="10" fill="#64748b">服务</text>
</svg>
